
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications | BatStateU Lost & Found</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="feed.html" aria-label="BatStateU Lost and Found">⌕</a>

        <nav class="nav">
          <a href="user-dashboard.html" title="Dashboard">⌂<span>Dashboard</span></a>
          <a href="feed.html" title="Feed">▦<span>Feed</span></a>
          <a href="report-item.html" title="Report item">＋<span>Report</span></a>
          <a href="my-listings.html" title="My listings">▤<span>My Listings</span></a>
          <a href="notifications.html" class="active" title="Notifications">♧<span>Alerts</span></a>
          <a href="profile.html" title="Profile">⚙<span>Profile</span></a>
        </nav>

        <div class="sidebar-bottom">
          <a href="index.html" id="logoutBtn" title="Sign out">⇥</a>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <label class="search">
            <span>⌕</span>
            <input
              type="search"
              placeholder="Search for an item..."
              aria-label="Search listings"
            />
          </label>

          <div class="top-actions">
            <a class="icon-btn" href="feed.html" title="Browse">▦</a>
            <a class="icon-btn" href="notifications.html" title="Notifications">♧</a>
            <a class="avatar" id="userAvatar" href="profile.html" title="Profile">S</a>
          </div>
        </header>

        <section class="content">
          <div class="page-heading">
            <div>
              <div class="eyebrow">Stay updated</div>
              <h1>Notifications</h1>
              <p class="subtitle">
                Updates about your listings and claim requests.
              </p>
            </div>

            <button
              class="btn btn-outline"
              id="markAllReadBtn"
              type="button"
            >
              Mark all as read
            </button>
          </div>

          <div class="panel" id="notificationsList">
            <p class="subtitle">Loading notifications...</p>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
  </body>
</html>
